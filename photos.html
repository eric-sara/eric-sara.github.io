  /* 這一頁自己的版面。色票、字型沿用 app.css。 */
  .ph-head { text-align: center; padding: 72px 24px 36px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .ph-back { font-size: var(--t-small); letter-spacing: .15em; color: var(--c-gold-dk); text-decoration: none; }
  .ph-grid { columns: 2; column-gap: 12px; padding: 0 12px 80px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 720px) { .ph-grid { columns: 3; column-gap: 16px; padding: 0 16px 96px; } }
  /* 進場跟主頁的相片一樣：printDrop（app.css）從下方帶一點旋轉浮上來，
     同一批進入畫面的照片依序錯開 —— 延遲由 JS 寫在 animation-delay。 */
  .ph-item { break-inside: avoid; margin: 0 0 12px; background: var(--c-card); padding: 8px 8px 8px; border-radius: 3px; box-shadow: 0 6px 20px rgba(74, 64, 60, .10); cursor: zoom-in; opacity: 0; }
  @media (min-width: 720px) { .ph-item { margin-bottom: 16px; padding: 10px; } }
  .ph-item.in { animation: printDrop 1s ease-out both; }
  .ph-item img { width: 100%; display: block; }

  /* 燈箱 */
  #lb { position: fixed; inset: 0; z-index: 9999; background: rgba(251, 247, 244, .96); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s; }
  #lb.on { display: flex; }
  #lb img { max-width: 94vw; max-height: 86vh; box-shadow: 0 20px 60px rgba(74, 64, 60, .25); background: #fff; padding: 8px; border-radius: 3px; user-select: none; -webkit-user-drag: none; }
  #lb .lb-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; background: rgba(255, 255, 255, .85); border-radius: 50%; color: var(--c-gold-dk); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; }
  #lb .lb-prev { left: 12px; } #lb .lb-next { right: 12px; }
  #lb .lb-close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border: none; background: rgba(255, 255, 255, .85); border-radius: 50%; color: var(--c-gold-dk); font-size: 20px; cursor: pointer; }
  #lb .lb-count { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-family: 'Lato', sans-serif; font-size: 12px; letter-spacing: .2em; color: var(--c-ink-60); }
  @media (prefers-reduced-motion: reduce) { .ph-item, .ph-item.in { animation: none; opacity: 1; } }
  /* 疊在喜帖裡開的時候，右上角被喜帖的音樂／回覆／資訊鈕佔掉，燈箱的關閉鈕改放左上 */
  .embed #lb .lb-close { right: auto; left: 14px; }

  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" type="button" aria-label="下一張">›</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
(function () {
  'use strict';

  /* 從喜帖裡疊開（index.html 的 iframe）時：「回喜帖」不換頁，請外層把相簿收起來，背景音樂才不會斷。
     直接打開 photos.html 的話照舊是一般連結。 */
  var embedded = window.parent !== window && /[?&]embed=1/.test(location.search);
  if (embedded) {
    document.documentElement.classList.add('embed');
    Array.prototype.forEach.call(document.querySelectorAll('.ph-back'), function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        window.parent.postMessage('closeGallery', location.origin);
      });
    });
  }

  var items =Array.prototype.slice.call(document.querySelectorAll('.ph-item'));
  var srcs = items.map(function (f) { return f.querySelector('img').getAttribute('src'); });

  /* 進場：捲到才浮現 */
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced && 'IntersectionObserver' in window) {
    // 同一次回呼裡進入畫面的照片，依序各延 160ms，才會「一張一張」出現而不是一次全亮
    var io = new IntersectionObserver(function (es) {
      var n = 0;
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.style.animationDelay = (n++ * 160) + 'ms';
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
    items.forEach(function (f) { io.observe(f); });
  } else {
    items.forEach(function (f) { f.classList.add('in'); });
  }

  /* 燈箱 */
  var lb = document.getElementById('lb'), img = document.getElementById('lbImg'), cnt = document.getElementById('lbCount');
  var cur = -1;
  function show(i) {
    cur = (i + srcs.length) % srcs.length;
    img.src = srcs[cur];
    cnt.textContent = (cur + 1) + ' / ' + srcs.length;
  }
  function open(i) {
    show(i);
    lb.classList.add('on');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { lb.style.opacity = '1'; });
  }
  function close() {
    lb.style.opacity = '0';
    document.body.style.overflow = '';
    setTimeout(function () { lb.classList.remove('on'); }, 300);
  }
  items.forEach(function (f, i) { f.addEventListener('click', function () { open(i); }); });
  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('.lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(cur - 1); });
  lb.querySelector('.lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(cur + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target === img) close(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(cur - 1);
    else if (e.key === 'ArrowRight') show(cur + 1);
  });

  /* 手機左右滑動換張、往下滑關閉 */
  var sx = 0, sy = 0;
  lb.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(dx < 0 ? cur + 1 : cur - 1);
    else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) close();
  }, { passive: true });
})();
</script>
