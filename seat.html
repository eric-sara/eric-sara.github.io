<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>座位查詢 ・ 王博玄 ＆ 楊琇</title>
<meta name="description" content="輸入姓名查桌次，阿狗帶你走到座位">
<meta name="theme-color" content="#FBF7F4">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>%F0%9F%A4%8D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Lato:wght@300&family=Noto+Sans+TC:wght@300&family=Noto+Serif+TC:wght@300;500&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* 這一頁自己的版面。色票、字型沿用 app.css。
     四個畫面（輸入／同名／結果／平面圖）都在這一頁，用 .on 切換，不換網址。 */
  .st-head { text-align: center; padding: 72px 24px 28px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .st-back { font-size: var(--t-small); letter-spacing: .15em; color: var(--c-gold-dk); text-decoration: none; }
  .st-en   { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: .32em; text-indent: .32em; color: var(--c-ink-60); }
  .st-main { width: min(86vw, 480px); margin: 0 auto; padding: 0 0 48px; }

  .st-screen    { display: none; flex-direction: column; align-items: center; gap: 24px; }
  .st-screen.on { display: flex; animation: textIn .6s ease-out both; }

  .st-card  { width: 100%; background: var(--c-card); border-radius: 3px; box-shadow: 0 8px 28px rgba(74, 64, 60, .10); padding: 32px 24px 34px; display: flex; flex-direction: column; gap: 20px; text-align: center; }
  .st-title { font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: var(--t-lead); color: var(--c-ink); }
  .st-label { font-size: var(--t-small); color: var(--c-ink-60); line-height: 1.9; }

  /* 輸入框：跟主頁出席回覆的欄位同一套，聚焦時一條金線從中間畫開 */
  .st-input { width: 100%; background-color: var(--c-bg); border: 1px solid rgba(196, 163, 143, .35); border-radius: 3px; outline: none; padding: 12px; font-size: var(--t-body); color: var(--c-ink); font-family: 'Noto Sans TC', sans-serif; font-weight: 300; text-align: center; letter-spacing: .12em; -webkit-appearance: none; appearance: none;
              background-image: linear-gradient(var(--c-gold), var(--c-gold)); background-repeat: no-repeat; background-position: center bottom; background-size: 0% 1px; background-clip: padding-box;
              transition: border-color .3s, background-size .38s cubic-bezier(.2, .7, .2, 1); }
  .st-input:focus { border-color: var(--c-pink); background-size: 100% 1px; }

  /* 按鈕、文字連結：比照主頁「加入行事曆」「婚紗照搶先看」 */
  .st-btn  { display: block; width: 100%; height: 52px; line-height: 52px; text-align: center; background: var(--c-pink); color: var(--c-ink); border: none; border-radius: 3px; letter-spacing: .15em; text-indent: .15em; font-family: 'Noto Sans TC', sans-serif; font-weight: 300; font-size: var(--t-body); cursor: pointer; text-decoration: none; }
  .st-btn.sm { width: auto; height: 48px; line-height: 48px; padding: 0 36px; font-size: 15px; }
  .st-link { background: none; border: none; font-family: inherit; font-weight: 300; font-size: var(--t-small); letter-spacing: .15em; color: var(--c-gold-dk); text-decoration: underline; cursor: pointer; padding: 6px 8px; }
  .st-hint { font-size: var(--t-small); color: var(--c-ink-60); line-height: 1.9; min-height: 1.9em; }
  .st-hint.err { color: var(--c-rose-dk); }
  .st-shake { animation: stShake .4s; }
  @keyframes stShake { 25% { transform: translateX(-6px) } 50% { transform: translateX(5px) } 75% { transform: translateX(-3px) } }

  /* 阿狗＋對話泡泡 */
  .st-dog    { display: flex; align-items: flex-start; justify-content: center; gap: 12px; }
  .st-dogbox { width: 150px; font-size: 12px; flex: none; }   /* 桌號牌大小跟著 font-size */
  .st-bubble { position: relative; margin-top: 18px; background: var(--c-card); border: 1px solid var(--c-gold); border-radius: 16px; padding: 10px 16px; font-size: var(--t-small); letter-spacing: .1em; color: var(--c-ink); white-space: nowrap; box-shadow: 0 4px 14px rgba(74, 64, 60, .08); }
  .st-bubble::after { content: ''; position: absolute; left: -7px; top: 15px; width: 12px; height: 12px; background: var(--c-card); border-left: 1px solid var(--c-gold); border-bottom: 1px solid var(--c-gold); transform: rotate(45deg); }

  /* 開放前的倒數 */
  .st-when { font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: var(--t-lead); color: var(--c-ink); letter-spacing: .08em; }
  .st-cd   { display: flex; justify-content: center; gap: 10px; }
  .st-cd div   { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 52px; }
  .st-cd b     { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(34px, 10vw, 44px); line-height: 1; color: var(--c-gold-dk); font-variant-numeric: tabular-nums; }
  .st-cd small { font-size: 12px; letter-spacing: .2em; text-indent: .2em; color: var(--c-ink-60); }
  .st-sep  { width: 60px; height: 1px; background: var(--c-gold); opacity: .5; margin: 0 auto; }

  /* 同名清單 */
  .st-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .st-pick { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 16px; background: var(--c-bg); border: 1px solid rgba(196, 163, 143, .35); border-radius: 3px; font-family: inherit; font-weight: 300; font-size: var(--t-body); color: var(--c-ink); cursor: pointer; text-align: left; transition: border-color .25s; }
  .st-pick:hover, .st-pick:focus-visible { border-color: var(--c-gold); outline: none; }
  .st-pick small { font-size: var(--t-small); color: var(--c-ink-60); white-space: nowrap; }

  /* 標題手寫字：一道金光每隔幾秒掃過去 */
  .st-script { font-family: 'Parisienne', cursive; font-size: clamp(28px, 7vw, 44px); line-height: 1; color: var(--c-gold-dk);
               background: linear-gradient(100deg, var(--c-gold-dk) 30%, #F2DECB 48%, var(--c-gold-dk) 66%); background-size: 300% 100%;
               -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
               animation: stShine 6s ease-in-out 1.2s infinite; }
  @keyframes stShine { 0%, 100% { background-position: 120% 0 } 50% { background-position: -20% 0 } }

  /* 查詢中的三個小點 */
  .st-dots   { display: inline-block; margin-left: 4px; }
  .st-dots i { display: inline-block; width: 3px; height: 3px; margin-left: 3px; border-radius: 50%; background: var(--c-gold-dk); opacity: .25; animation: stDots 1.1s ease-in-out infinite; }
  .st-dots i:nth-child(2) { animation-delay: .18s }
  .st-dots i:nth-child(3) { animation-delay: .36s }
  @keyframes stDots { 0%, 100% { opacity: .25; transform: translateY(0) } 45% { opacity: 1; transform: translateY(-3px) } }

  /* 結果卡 */
  .st-no   { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(76px, 24vw, 128px); line-height: 1; color: var(--c-gold-dk);
             background: linear-gradient(100deg, var(--c-gold-dk) 30%, #EBD3BE 48%, var(--c-gold-dk) 66%); background-size: 300% 100%;
             -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  /* 桌號滾完落定：彈一下，之後金面持續微微流動 */
  .st-no.landed { animation: noPop .62s cubic-bezier(.2, 1.45, .35, 1), stShine 3.6s ease-in-out .7s infinite; }
  @keyframes noPop { 0% { opacity: .2; transform: scale(.55) } 60% { opacity: 1 } 100% { opacity: 1; transform: none } }

  /* 桌號落定時從數字後面灑出來的小花瓣 */
  .st-nowrap  { position: relative; }
  .st-burst   { position: absolute; left: 50%; top: 48%; width: 0; height: 0; pointer-events: none; }
  .st-burst i { position: absolute; width: 7px; height: 10px; margin: -5px 0 0 -3px; border-radius: 60% 60% 54% 54% / 72% 72% 40% 40%; opacity: 0; animation: stPetal var(--d) cubic-bezier(.15, .75, .3, 1) forwards; }
  @keyframes stPetal { 0% { opacity: 0; transform: translate(0, 0) scale(.3) } 18% { opacity: .95 } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1) } }

  /* 結果卡裡的每一列依序浮上來；第 2 格是桌號，它自己有滾動動畫就不插手 */
  #s3.on .st-card > *              { animation: textIn .55s ease-out both; }
  #s3.on .st-card > *:nth-child(1) { animation-delay: .06s }
  #s3.on .st-card > *:nth-child(2) { animation: none }
  #s3.on .st-card > *:nth-child(3) { animation-delay: .50s }
  #s3.on .st-card > *:nth-child(4) { animation-delay: .60s }
  #s3.on .st-card > *:nth-child(5) { animation-delay: .70s }
  #s3.on .st-card > *:nth-child(6) { animation-delay: .78s }
  #s3.on .st-rule path { stroke-dasharray: 340; animation: stDraw 1.2s ease-out .52s both; }
  @keyframes stDraw { from { stroke-dashoffset: 340 } to { stroke-dashoffset: 0 } }
  /* 同桌名單一顆一顆跳出來（delay 由 JS 逐一給） */
  .st-mates span { animation: stChip .42s cubic-bezier(.2, 1.3, .35, 1) both; }
  @keyframes stChip { from { opacity: 0; transform: translateY(6px) scale(.9) } to { opacity: 1; transform: none } }
  /* 同名清單也一樣依序出現 */
  #s2.on .st-pick { animation: textIn .45s ease-out both; }

  .st-name { font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: var(--t-title); color: var(--c-ink); }
  .st-name small { font-size: var(--t-small); font-weight: 300; color: var(--c-ink-60); margin-left: 8px; }
  .st-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .st-tag  { display: inline-block; padding: 5px 14px; border: 1px solid var(--c-gold); border-radius: 999px; font-size: var(--t-small); letter-spacing: .08em; color: var(--c-ink); }
  .st-tag.acc { background: var(--c-pink); border-color: var(--c-pink); }
  .st-tag:empty { display: none; }
  .st-mates { font-size: var(--t-small); color: var(--c-ink-60); line-height: 2; }
  .st-mates:empty { display: none; }
  .st-mates span { display: inline-block; margin: 2px 4px; padding: 1px 10px; border: 1px solid rgba(196, 163, 143, .5); border-radius: 999px; color: var(--c-ink); }

  /* 平面圖。SVG 寬度跟著容器走、高度依 viewBox 比例，不會撐出橫向捲動 */
  .st-mapcard { padding: 14px 10px 10px; }
  .st-map  { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; overflow: visible; }
  .st-bar  { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
  .map-wall  { fill: var(--c-card); fill-opacity: .6; stroke: var(--c-gold); stroke-width: 1.2; }
  .map-aisle { fill: var(--c-pink); fill-opacity: .32; }
  .map-stage { fill: var(--c-pink); fill-opacity: .55; stroke: var(--c-gold); stroke-width: 1; }
  .map-zh  { font-family: 'Noto Serif TC', serif; font-weight: 500; fill: var(--c-ink); }
  .map-en  { font-family: 'Lato', sans-serif; font-weight: 300; fill: var(--c-ink-60); letter-spacing: .2em; font-size: 7px; }
  .map-lbl { font-family: 'Noto Sans TC', sans-serif; font-weight: 300; fill: var(--c-ink-60); font-size: 9px; }
  .tbl circle { fill: var(--c-card); stroke: var(--c-gold); stroke-width: 1.2; transition: fill .4s, stroke .4s; }
  .tbl text   { font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: 14px; fill: var(--c-ink); text-anchor: middle; dominant-baseline: central; transition: font-size .4s, fill .4s; }
  .tbl .chair { fill: none; stroke: var(--c-gold); stroke-width: .9; opacity: .5; }
  .tbl.hit circle { fill: var(--c-gold-dk); stroke: var(--c-gold-dk); }
  .tbl.hit text   { fill: #FFFFFF; font-size: 20px; }
  .route-line { fill: none; stroke: var(--c-gold); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
  /* 走過的地方即時長出一條細線（dashoffset 由 JS 跟著阿狗推） */
  .route-live { fill: none; stroke: var(--c-gold); stroke-width: 1.4; stroke-linecap: round; opacity: .5; }
  /* 桌子進場：第一次打開平面圖時一桌一桌亮起來（enter 用完就移除，才不會卡住 opacity） */
  .tbl { transition: opacity .6s ease; }
  .st-map.enter .tbl { animation: softIn .5s ease-out both; }
  /* 到了之後其他桌退到背景，只留你那一桌 */
  .st-map.focus .tbl:not(.hit) { opacity: .4; }
  /* 目標桌先脈動一圈當路標，入口也點一下光 */
  .aim-ring { fill: none; stroke: var(--c-gold-dk); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: aimPulse 1.9s ease-out infinite; }
  @keyframes aimPulse { 0% { transform: scale(.86); opacity: .55 } 70% { opacity: 0 } 100% { transform: scale(1.3); opacity: 0 } }
  .door-glow { fill: var(--c-gold); transform-box: fill-box; transform-origin: center; animation: doorPulse 1.7s ease-out infinite; }
  @keyframes doorPulse { 0% { transform: scale(.6); opacity: .5 } 100% { transform: scale(2.3); opacity: 0 } }
  /* 抵達那一下的擴散圈 */
  .hit-ring { fill: none; stroke: var(--c-gold-dk); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; animation: hitRing 1.1s ease-out forwards; }
  @keyframes hitRing { from { transform: scale(.8); opacity: .7 } to { transform: scale(2.1); opacity: 0 } }
  /* 腳步帶起的小塵煙 */
  .puff { fill: var(--c-gold); transform-box: fill-box; transform-origin: center; animation: puffUp .7s ease-out forwards; }
  @keyframes puffUp { 0% { opacity: .3; transform: scale(.3) } 100% { opacity: 0; transform: scale(1.7) translateY(-3px) } }
  .paw    { fill: var(--c-gold-dk); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .paw.go { animation: pawIn .3s ease-out forwards; }
  @keyframes pawIn { from { opacity: 0; transform: scale(1.5) } to { opacity: .55; transform: none } }
  .arrive    { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .arrive.go { animation: arrivePop .5s cubic-bezier(.2, 1.35, .35, 1) forwards; }
  @keyframes arrivePop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: none } }
  .hearts path    { fill: var(--c-rose); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .hearts.go path { animation: heartUp 1.4s ease-out forwards; }
  .hearts.go g:nth-child(2) path { animation-delay: .15s }
  .hearts.go g:nth-child(3) path { animation-delay: .3s }
  @keyframes heartUp { 0% { opacity: 0; transform: translateY(0) scale(.4) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-26px) scale(1) } }

  @media (prefers-reduced-motion: reduce) {
    .st-screen.on, .st-shake { animation: none; }
    .paw.go, .arrive.go, .hearts.go path { animation: none; }
    .paw.go { opacity: .55; }
    .arrive.go { opacity: 1; }
    .tbl circle, .tbl text { transition: none; }
    .st-script, .st-no.landed, .st-dots i, .st-map.enter .tbl { animation: none; }
    #s3.on .st-card > *, .st-mates span, #s2.on .st-pick { animation: none; opacity: 1; transform: none; }
    #s3.on .st-rule path { animation: none; stroke-dasharray: none; }
    .aim-ring, .door-glow, .hit-ring, .puff { display: none; }
    .tbl { transition: none; }
  }
</style>
</head>
<body>
<div id="grain" aria-hidden="true"></div>

<header class="st-head">
  <a class="st-back" href="index.html?skip=1#venue">← 回喜帖</a>
  <div class="st-script">find your seat</div>
  <div style="font-family:'Noto Serif TC',serif;font-weight:500;font-size:var(--t-title);color:#4A403C;">座位查詢</div>
  <div style="font-size:var(--t-small);color:rgba(74,64,60,.75);">輸入姓名查桌次，阿狗帶你走到座位</div>
</header>

<main class="st-main">

  <!-- ── 0 還沒開放：倒數，時間到自動換成輸入畫面 ── -->
  <section class="st-screen" id="s0">
    <div class="st-dog"><div class="st-dogbox" id="dog0"></div><div class="st-bubble">位子還在排喔</div></div>
    <div class="st-card">
      <div class="st-en">opens on</div>
      <div class="st-when">12/5（六）中午 12:00 開放</div>
      <div class="st-cd" aria-live="off">
        <div><b id="cdD">--</b><small>天</small></div>
        <div><b id="cdH">--</b><small>時</small></div>
        <div><b id="cdM">--</b><small>分</small></div>
        <div><b id="cdS">--</b><small>秒</small></div>
      </div>
      <div class="st-sep"></div>
      <div class="st-label">還沒回覆出席的話，先填一下<br>我們才好幫你留位子</div>
      <a class="st-btn" href="index.html?skip=1#rsvp" data-press="1">去回覆出席</a>
    </div>
  </section>

  <!-- ── 1 輸入 ── -->
  <section class="st-screen on" id="s1">
    <div class="st-dog"><div class="st-dogbox" id="dog1"></div><div class="st-bubble" id="bub1">我幫你找</div></div>
    <form class="st-card" id="seatForm" novalidate>
      <label style="display:flex;flex-direction:column;gap:8px;">
        <span class="st-label">姓名</span>
        <input class="st-input" id="q" type="text" name="name" autocomplete="off" enterkeyhint="search" maxlength="20" placeholder="寫上你的名字">
      </label>
      <button class="st-btn" id="go" type="submit" data-press="1">查　詢</button>
      <div class="st-hint" id="hint">只寫一部分也找得到</div>
    </form>
  </section>

  <!-- ── 2 同名多人 ── -->
  <section class="st-screen" id="s2">
    <div class="st-card">
      <div class="st-title">是哪一位呢？</div>
      <div class="st-label" id="pickSub"></div>
      <div class="st-list" id="list"></div>
      <div><button class="st-link" type="button" data-reset>← 重新輸入</button></div>
    </div>
  </section>

  <!-- ── 3 結果 ── -->
  <section class="st-screen" id="s3">
    <div class="st-card">
      <div class="st-en">your table</div>
      <div class="st-nowrap"><div class="st-no" id="rNo"></div><div class="st-burst" id="burst" aria-hidden="true"></div></div>
      <div class="st-rule" style="display:flex;justify-content:center;"><svg viewBox="0 0 320 24" aria-hidden="true" style="width:min(50vw,200px);height:24px;display:block;"><path d="M2 12 C 60 2, 120 22, 160 12 S 260 2, 318 12" stroke="#C4A38F" stroke-width="1" fill="none"></path></svg></div>
      <div class="st-name"><span id="rName"></span><small>你好</small></div>
      <div class="st-tags"><span class="st-tag" id="rKept"></span><span class="st-tag acc" id="rFree"></span></div>
      <div class="st-mates" id="rMates"></div>
    </div>
    <div class="st-dog"><div class="st-dogbox" id="dog2"></div><div class="st-bubble">跟我來，帶你去</div></div>
    <button class="st-btn" id="see" type="button" data-press="1">看平面圖</button>
    <button class="st-link" type="button" data-reset>重新查詢</button>
  </section>

  <!-- ── 4 平面圖 ── -->
  <section class="st-screen" id="s4">
    <div style="text-align:center;display:flex;flex-direction:column;gap:8px;">
      <div class="st-title"><span id="mName"></span>，阿狗帶路</div>
      <div class="st-label" id="mSub"></div>
    </div>
    <div class="st-card st-mapcard"><svg class="st-map" id="map" viewBox="0 0 360 460" role="img" aria-label="會場平面圖"></svg></div>
    <button class="st-btn sm" id="again" type="button" data-press="1">再走一次</button>
    <div class="st-bar">
      <button class="st-link" type="button" id="toCard">← 回座位卡</button>
      <button class="st-link" type="button" data-reset>重新查詢</button>
    </div>
  </section>

</main>

<footer style="text-align:center;padding:24px 24px 80px;display:flex;flex-direction:column;align-items:center;gap:18px;">
  <span style="width:60px;height:1px;background:var(--c-gold);"></span>
  <div style="font-family:'Noto Serif TC',serif;font-weight:300;font-size:32px;color:var(--c-rose);line-height:1;">囍</div>
  <a class="st-back" href="index.html?skip=1#venue">← 回喜帖</a>
</footer>

<script src="assets/js/pdog.js"></script>
<script src="assets/js/seat-data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.SEAT_DATA, P = D.plan, NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 比對：先找完全相同，找不到再找「名字包含輸入字」；aliases 一起比；臺／台視為同字 ── */
  const norm = (s) => (s || '').replace(/\s+/g, '').replace(/臺/g, '台').toLowerCase();
  const keys = (g) => [g.name].concat(g.aliases || []).map(norm);
  function search(q) {
    const n = norm(q);
    if (!n) return [];
    const exact = D.guests.filter((g) => keys(g).includes(n));
    return exact.length ? exact : D.guests.filter((g) => keys(g).some((k) => k.includes(n)));
  }

  /* ── 畫面切換 ── */
  const screens = ['s0', 's1', 's2', 's3', 's4'];
  function show(id) {
    screens.forEach((s) => {
      const sec = $(s);
      sec.classList.remove('on');
      if (s === id) { void sec.offsetWidth; sec.classList.add('on'); }
    });
    window.scrollTo(0, 0);
  }

  const q = $('q'), hint = $('hint'), form = $('seatForm');
  const HINT = '只寫一部分也找得到';
  function err(msg) {
    hint.innerHTML = msg;
    hint.classList.add('err');
    if (!reduced) { form.classList.remove('st-shake'); void form.offsetWidth; form.classList.add('st-shake'); }
  }
  q.addEventListener('input', () => { hint.classList.remove('err'); hint.textContent = HINT; });

  /* ── 查詢中的空檔 ──
     結果其實是同步算出來的，但立刻跳畫面少了一點期待感。
     中間停半秒讓阿狗低頭聞一聞，按鈕也先鎖住避免連點。 */
  const go = $('go'), bub1 = $('bub1'), GO_TXT = go.textContent;
  let busy = false, busyT = 0;
  function seeking(done) {
    if (reduced) return done();
    busy = true;
    go.disabled = true;
    go.textContent = '找找看';
    const dog = $('dog1').querySelector('.pdog');
    if (dog) { dog.classList.remove('idle'); dog.classList.add('sniff'); }
    bub1.innerHTML = '聞聞看<span class="st-dots"><i></i><i></i><i></i></span>';
    busyT = setTimeout(() => {
      busy = false;
      go.disabled = false;
      go.textContent = GO_TXT;
      if (dog) { dog.classList.remove('sniff'); dog.classList.add('idle'); }
      bub1.textContent = '我幫你找';
      done();
    }, 620);
  }

  function submit() {
    if (busy) return;
    q.blur();
    if (!norm(q.value)) return err('先寫上名字喔');
    const r = search(q.value);
    if (!r.length) return err('找不到這個名字，試試只寫一部分<br>或直接在 LINE 問我們');
    seeking(() => { if (r.length > 1) pick(r, q.value); else open(r[0]); });
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); submit(); });

  /* ── 同名多人：列出每一位＋note，讓賓客自己點 ── */
  function pick(r, typed) {
    $('pickSub').textContent = '名字裡有「' + typed.trim() + '」的有 ' + r.length + ' 位，點一下你自己';
    const list = $('list');
    list.innerHTML = '';
    r.forEach((g, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'st-pick';
      const n = document.createElement('span');
      n.textContent = g.name;
      b.appendChild(n);
      if (g.note) { const s = document.createElement('small'); s.textContent = g.note; b.appendChild(s); }
      b.style.animationDelay = (0.1 + i * 0.07).toFixed(2) + 's';
      b.addEventListener('click', () => open(g));
      list.appendChild(b);
    });
    show('s2');
  }

  /* ── 座位分配（同桌名單用） ── */
  const seatMap = {};
  D.guests.forEach((g) => {
    const t = g.table;
    seatMap[t] = seatMap[t] || [];
    for (let i = 0; i < (g.seats || 1); i++) seatMap[t].push({ g, first: i === 0 });
  });

  /* ── 桌號像翻牌一樣滾過幾個號碼再落定 ──
     每跳一次間隔乘 1.12，愈後面愈慢，最後一下換成真正的桌號並灑花瓣。 */
  const rNo = $('rNo'), burstBox = $('burst');
  const POOL = P.tables.map((t) => String(t.no));
  let rollT = 0;
  function rollNo(final) {
    clearTimeout(rollT);
    rNo.classList.remove('landed');
    if (reduced || !POOL.length) { rNo.textContent = final; rNo.classList.add('landed'); return; }
    let i = 0, gap = 42;
    const tick = () => {
      if (++i >= 11) {
        rNo.textContent = final;
        void rNo.offsetWidth;
        rNo.classList.add('landed');
        burst();
        return;
      }
      rNo.textContent = POOL[(Math.random() * POOL.length) | 0];
      gap *= 1.12;
      rollT = setTimeout(tick, gap);
    };
    rNo.textContent = POOL[0];
    rollT = setTimeout(tick, 140);
  }

  /* 桌號落定時從數字後面灑出一把小花瓣，動畫跑完就清掉 */
  const PETAL = ['var(--c-rose)', 'var(--c-gold)', 'var(--c-pink)'];
  function burst() {
    if (reduced) return;
    burstBox.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('i');
      p.style.background = PETAL[i % PETAL.length];
      p.style.setProperty('--x', (Math.random() * 240 - 120).toFixed(0) + 'px');
      p.style.setProperty('--y', (-40 - Math.random() * 110).toFixed(0) + 'px');
      p.style.setProperty('--r', (Math.random() * 540 - 270).toFixed(0) + 'deg');
      p.style.setProperty('--d', (1.1 + Math.random() * .7).toFixed(2) + 's');
      p.style.animationDelay = (Math.random() * .18).toFixed(2) + 's';
      burstBox.appendChild(p);
    }
    setTimeout(() => { burstBox.innerHTML = ''; }, 2200);
  }

  let guest = null, table = null;
  function open(g) {
    guest = g;
    table = P.tables.find((t) => String(t.no) === String(g.table));
    $('rName').textContent = g.name;
    $('rKept').textContent = '為你留了 ' + (g.seats || 1) + ' 個位子';
    $('rFree').textContent = D.freeSeating ? '同桌自由入座' : '';
    const mates = (seatMap[g.table] || []).filter((s) => s.first && s.g !== g).map((s) => s.g.name);
    const mb = $('rMates');
    mb.innerHTML = '';
    if (D.showTablemates !== false && mates.length) {
      mb.appendChild(document.createTextNode('同桌還有'));
      mb.appendChild(document.createElement('br'));
      mates.forEach((n, i) => {
        const s = document.createElement('span');
        s.textContent = n;
        s.style.animationDelay = (0.82 + i * 0.06).toFixed(2) + 's';
        mb.appendChild(s);
      });
    }
    $('mName').textContent = g.name;
    $('mSub').textContent = '跟著腳印走到 ' + g.table + ' 桌' + (table && table.label ? '（' + table.label + '）' : '');
    $('dog2').innerHTML = pdogHTML({ cls: 'happy', tag: String(g.table) });
    $('see').style.display = table ? '' : 'none';   // 名單上的桌號不在平面圖裡就先不給看圖
    show('s3');
    rollNo(String(g.table));   // 畫面亮起來之後才開始滾，數字落定的那一下才是重點
  }

  /* ═══ 平面圖 ═══
     座標全部來自 seat-data.js 的 plan（畫布 360×460）。 */
  const svg = $('map');
  const R = P.tableR || 24, SEATS = P.seatsPerTable || 10;
  const DOG = { w: 38, h: 51 };        // 阿狗在平面圖上的大小（viewBox 單位，比例跟 dog_cut.png 一致），錨點在腳底中央
  let built = false, routeLayer, dogLayer, raf = 0;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function build() {
    if (built) return;
    built = true;
    const ax = P.aisleX, aw = P.aisleW, cy = P.corridorY, st = P.stage;
    el('rect', { x: 12, y: 12, width: 336, height: 436, rx: 4, class: 'map-wall' });
    // L 型走道：入口橫走道 → 中央直走道到舞台前
    el('path', { d: 'M13 ' + (cy - aw / 2) + ' H ' + (ax + aw / 2) + ' V ' + (st.y + st.h + 2) + ' H ' + (ax - aw / 2) + ' V ' + (cy + aw / 2) + ' H 13 Z', class: 'map-aisle' });
    el('rect', { x: st.x, y: st.y, width: st.w, height: st.h, rx: 3, class: 'map-stage' });
    el('text', { x: st.x + st.w / 2, y: st.y + st.h / 2 + 1, class: 'map-zh', 'font-size': 12, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'letter-spacing': '.3em' }).textContent = st.label;
    // 入口：牆上開一個缺口
    el('rect', { x: 9, y: cy - aw / 2 + 2, width: 6, height: aw - 4, fill: '#FBF7F4' });
    el('text', { x: 22, y: cy + aw / 2 + 13, class: 'map-lbl' }).textContent = P.door.label;
    el('text', { x: 22, y: cy + aw / 2 + 23, class: 'map-en' }).textContent = 'ENTRANCE';
    routeLayer = el('g', {});
    P.tables.forEach((t, i) => {
      const g = el('g', { class: 'tbl', 'data-no': t.no });
      g.style.animationDelay = (i * 0.04).toFixed(2) + 's';   // 一桌一桌亮起來
      for (let i = 0; i < SEATS; i++) {
        const a = -Math.PI / 2 + i / SEATS * Math.PI * 2;
        el('circle', { cx: (t.x + Math.cos(a) * (R + 4.5)).toFixed(1), cy: (t.y + Math.sin(a) * (R + 4.5)).toFixed(1), r: 2.2, class: 'chair' }, g);
      }
      el('circle', { cx: t.x, cy: t.y, r: R - 2 }, g);
      el('text', { x: t.x, y: t.y + 1 }, g).textContent = t.no;
      if (t.label) el('text', { x: t.x, y: t.y - R - 9, class: 'map-lbl', 'text-anchor': 'middle' }).textContent = t.label;
    });
    dogLayer = el('g', {});
    // enter 只在第一次打開平面圖時掛著，進場跑完就拿掉 ──
    // 留著的話 animation 的 both 會把 opacity 鎖住，之後的聚光效果就按不動了
    svg.classList.add('enter');
    setTimeout(() => svg.classList.remove('enter'), 1500);
  }

  /* ── 終點：阿狗要停在桌子旁邊的走道上，而且不能蓋到任何一桌的桌號 ──
     候選順序：走道那一側 → 桌子正下方的通道 → 另一側。逐一檢查阿狗的外框
     有沒有壓到桌號（目標桌桌號放大後範圍更大），第一個過關的就是終點。 */
  const numBox = (t, big) => { const r = big ? 12 : 9; return { x1: t.x - r, y1: t.y - r, x2: t.x + r, y2: t.y + r }; };
  const dogBox = (x, y) => ({ x1: x - DOG.w / 2, y1: y + 4 - DOG.h, x2: x + DOG.w / 2, y2: y + 4 });
  const hits = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
  const inside = (b) => b.x1 >= 12 && b.x2 <= 348 && b.y1 >= P.stage.y + P.stage.h && b.y2 <= 448;
  function okSpot(t, x, y) {
    const db = dogBox(x, y);
    return inside(db) && !P.tables.some((o) => hits(db, numBox(o, o === t)));
  }
  function stopSpot(t) {
    const side = t.x < P.aisleX ? 1 : -1;   // +1 = 走道在桌子右邊
    const cands = [
      { x: t.x + side * (R + 32), y: t.y + 14, laneY: t.y + 14 },
      { x: t.x, y: t.y + R + 37, laneY: t.y + R + 18 },
      { x: t.x - side * (R + 32), y: t.y + 14, laneY: t.y + 14 }
    ];
    return cands.find((c) => okSpot(t, c.x, c.y)) || cands[0];
  }

  /* 路線：入口 → 橫走道 → 直走道 → 該排通道 → 終點。轉角修圓。 */
  function routePts(sp) {
    const raw = [[P.door.x - 12, P.corridorY], [P.aisleX, P.corridorY], [P.aisleX, sp.laneY], [sp.x, sp.laneY], [sp.x, sp.y]];
    const pts = [raw[0]];
    raw.slice(1).forEach((p) => { const l = pts[pts.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.5) pts.push(p); });
    return pts;
  }
  function routeD(pts) {
    let d = 'M' + pts[0];
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const l1 = Math.hypot(x - px, y - py), l2 = Math.hypot(nx - x, ny - y), rr = Math.min(10, l1 / 2, l2 / 2);
      d += ' L' + (x - (x - px) / l1 * rr) + ' ' + (y - (y - py) / l1 * rr) + ' Q' + x + ' ' + y + ' ' + (x + (nx - x) / l2 * rr) + ' ' + (y + (ny - y) / l2 * rr);
    }
    return d + ' L' + pts[pts.length - 1];
  }

  const PAW = 'M0 0.6 a2.1 2.4 0 1 0 0.01 0 M-2.6 -2.2 a1 1.2 0 1 0 .01 0 M-0.9 -3.2 a1 1.2 0 1 0 .01 0 M0.9 -3.2 a1 1.2 0 1 0 .01 0 M2.6 -2.2 a1 1.2 0 1 0 .01 0';

  function walk() {
    cancelAnimationFrame(raf);
    routeLayer.innerHTML = '';
    dogLayer.innerHTML = '';
    svg.classList.remove('focus');
    svg.querySelectorAll('.tbl').forEach((n) => n.classList.remove('hit'));

    const sp = stopSpot(table), pts = routePts(sp);
    const path = el('path', { d: routeD(pts), fill: 'none', stroke: 'none' }, routeLayer);
    const L = path.getTotalLength();
    // 這三個只在有動畫時才會建出來（關動畫偏好的分支不需要），所以先宣告、後面才指派
    let aim = null, door = null, live = null;

    /* 阿狗放在 foreignObject 裡。位置用 x / y 屬性直接搬，不對外層 <g> 做 transform ──
       WebKit 對 foreignObject 祖先的 transform 支援不穩，屬性定位最保險。
       上方多留 PAD 的空間給跳躍，foreignObject 預設會裁切超出的部分。 */
    const PAD = 10;
    const fo = el('foreignObject', { x: 0, y: 0, width: DOG.w, height: DOG.h + PAD }, dogLayer);
    fo.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + DOG.w + 'px;height:' + (DOG.h + PAD) + 'px;display:flex;align-items:flex-end;">' +
      '<div class="dogfig" style="width:' + DOG.w + 'px;font-size:3.4px;transform-origin:50% 100%;">' + pdogHTML({ cls: 'walk', tag: String(table.no) }) + '</div></div>';
    const fig = fo.querySelector('.dogfig'), dogEl = fo.querySelector('.pdog');
    const place = (x, y, lean) => {
      fo.setAttribute('x', (x - DOG.w / 2).toFixed(2));
      fo.setAttribute('y', (y + 4 - DOG.h - PAD).toFixed(2));
      fig.style.transform = 'rotate(' + lean + 'deg)';
    };

    let lastPaw = -99, pawSide = 1, pawN = 0;
    const paw = (s, instant) => {
      const pt = path.getPointAtLength(s), ahead = path.getPointAtLength(Math.min(L, s + 2));
      const ang = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI + 90;
      const ox = Math.cos(ang * Math.PI / 180) * 2.6 * pawSide, oy = Math.sin(ang * Math.PI / 180) * 2.6 * pawSide;
      pawSide = -pawSide;
      const g = el('g', { transform: 'translate(' + (pt.x + ox).toFixed(1) + ' ' + (pt.y + oy).toFixed(1) + ') rotate(' + ang.toFixed(1) + ')' }, routeLayer);
      const pw = el('path', { d: PAW, class: 'paw' }, g);
      if (instant) pw.classList.add('go'); else requestAnimationFrame(() => pw.classList.add('go'));
      // 每兩步帶起一小陣塵煙，跑完自己收掉
      if (!instant && pawN++ % 2 === 0) {
        const pf = el('circle', { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1), r: 3.2, class: 'puff' }, routeLayer);
        setTimeout(() => pf.remove(), 800);
      }
    };

    const finish = (pt) => {
      svg.querySelector('.tbl[data-no="' + table.no + '"]').classList.add('hit');
      if (aim) aim.remove();
      if (door) door.remove();
      svg.classList.add('focus');     // 其他桌退到背景，只留這一桌
      const hr = el('circle', { cx: table.x, cy: table.y, r: R + 4, class: 'hit-ring' }, routeLayer);
      setTimeout(() => hr.remove(), 1200);
      if (!reduced && navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
      dogEl.classList.remove('walk');
      dogEl.classList.add('happy');
      const tg = dogEl.querySelector('.ptag');
      if (tg) tg.style.opacity = '0';        // 桌子本身已經亮起來，牌子收掉
      // 「到了！」泡泡放在阿狗頭旁、靠走道那一側，避開桌號。
      // 定位用外層 <g> 的 transform 屬性；彈出動畫的 CSS transform 只掛在內層，兩者才不會互相蓋掉。
      const bs = pt.x < P.aisleX ? 1 : -1;
      const bubPos = el('g', { transform: 'translate(' + (pt.x + bs * 38).toFixed(1) + ' ' + (pt.y - 40).toFixed(1) + ')' }, dogLayer);
      const bub = el('g', { class: 'arrive' }, bubPos);
      el('path', { d: bs > 0 ? 'M-18 4 L-30 12 L-14 9 Z' : 'M18 4 L30 12 L14 9 Z', fill: '#FFFFFF', stroke: '#C4A38F', 'stroke-width': 1, 'stroke-linejoin': 'round' }, bub);
      el('rect', { x: -25, y: -11, width: 50, height: 22, rx: 11, fill: '#FFFFFF', stroke: '#C4A38F', 'stroke-width': 1 }, bub);
      el('text', { x: 0, y: 0.5, class: 'map-zh', 'font-size': 10, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, bub).textContent = '到了！';
      bub.classList.add('go');
      const hs = el('g', { class: 'hearts', transform: 'translate(' + table.x + ' ' + (table.y - R - 2) + ')' }, dogLayer);
      [-14, 0, 14].forEach((dx) => {
        const pos = el('g', { transform: 'translate(' + dx + ' 0)' }, hs);
        el('path', { d: 'M0 4 C-5 0 -6 -3 -5 -5 C-4 -7 -1 -7 0 -5 C1 -7 4 -7 5 -5 C6 -3 5 0 0 4 Z' }, pos);
      });
      hs.classList.add('go');
    };

    /* 關動畫偏好：直接畫出整條路線＋腳印，阿狗站在終點 */
    if (reduced) {
      el('path', { d: routeD(pts), class: 'route-line' }, routeLayer);
      for (let s = 0; s < L; s += 9) paw(s, true);
      const end = path.getPointAtLength(L);
      place(end.x, end.y, 0);
      finish(end);
      return;
    }

    /* 出發前先立路標：目標桌脈動一圈、入口點一下光，走到了再收掉 */
    aim = el('circle', { cx: table.x, cy: table.y, r: R + 7, class: 'aim-ring' }, routeLayer);
    door = el('circle', { cx: P.door.x + 2, cy: P.corridorY, r: 4, class: 'door-glow' }, routeLayer);
    /* 走過的路線即時長出一條細線：dasharray 設成全長，dashoffset 每一格往回收 */
    live = el('path', { d: routeD(pts), class: 'route-live' }, routeLayer);
    live.style.strokeDasharray = L;
    live.style.strokeDashoffset = L;

    const start = path.getPointAtLength(0);
    place(start.x, start.y, 0);
    const dur = Math.min(4200, 1600 + L * 5);
    let t0 = 0;
    const step = (ts) => {
      if (!t0) t0 = ts;
      const k = Math.min(1, (ts - t0) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // ease-in-out
      const s = L * e, pt = path.getPointAtLength(s), ahead = path.getPointAtLength(Math.min(L, s + 2));
      const dx = ahead.x - pt.x, dy = ahead.y - pt.y;
      const lean = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 7 : -7) : 0;
      place(pt.x, pt.y, lean);
      live.style.strokeDashoffset = (L - s).toFixed(1);
      if (s - lastPaw > 9) { lastPaw = s; paw(s, false); }
      if (k < 1) raf = requestAnimationFrame(step);
      else finish(pt);
    };
    setTimeout(() => { raf = requestAnimationFrame(step); }, 600);
  }

  $('see').addEventListener('click', () => { if (!table) return; build(); show('s4'); walk(); });
  $('again').addEventListener('click', () => { if (table) walk(); });
  $('toCard').addEventListener('click', () => { cancelAnimationFrame(raf); show('s3'); });
  document.querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', () => {
    cancelAnimationFrame(raf);
    clearTimeout(rollT);
    clearTimeout(busyT);
    busy = false;
    go.disabled = false;
    go.textContent = GO_TXT;
    bub1.textContent = '我幫你找';
    const d1 = $('dog1').querySelector('.pdog');
    if (d1) { d1.classList.remove('sniff'); d1.classList.add('idle'); }
    burstBox.innerHTML = '';
    rNo.classList.remove('landed');
    svg.classList.remove('focus');
    q.value = '';
    hint.classList.remove('err');
    hint.textContent = HINT;
    show('s1');
  }));

  $('dog1').innerHTML = pdogHTML({ cls: 'idle' });

  /* 網址帶 ?name=姓名 直接查（開放後才查） */
  const params = new URLSearchParams(location.search);
  const pre = params.get('name');
  function ready() {
    if (pre) { q.value = pre; setTimeout(submit, 400); }
  }

  /* ── 開放時間以前只給倒數；?preview=1 可以提前看真正的查詢畫面 ──
     時間以 seat-data.js 的 openAt 為準（台灣時間），歸零時自動切到輸入畫面 */
  const openAt = D.openAt ? new Date(D.openAt).getTime() : 0;
  if (openAt && Date.now() < openAt && params.get('preview') !== '1') {
    $('dog0').innerHTML = pdogHTML({ cls: 'idle' });
    const pad = (n) => String(n).padStart(2, '0');
    let cdT = 0;
    const tick = () => {
      const left = openAt - Date.now();
      if (left <= 0) { clearInterval(cdT); show('s1'); ready(); return; }
      const s = Math.floor(left / 1000);
      $('cdD').textContent = Math.floor(s / 86400);
      $('cdH').textContent = pad(Math.floor(s / 3600) % 24);
      $('cdM').textContent = pad(Math.floor(s / 60) % 60);
      $('cdS').textContent = pad(s % 60);
    };
    tick();
    cdT = setInterval(tick, 1000);
    show('s0');
  } else {
    ready();
  }
})();
</script>
</body>
</html>
